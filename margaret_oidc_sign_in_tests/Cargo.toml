margaret_oauth_client = { workspace = true }
margaret_oidc_sign_in = { workspace = true }
margaret_route_method = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
url = { workspace = true }

[dev-dependencies]
