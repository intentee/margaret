[package]
name = "margaret_oidc_sign_in_tests"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
cookie = { workspace = true }
form_urlencoded = { workspace = true }
http = { workspace = true }
margaret_authorization_server_client = { workspace = true }
margaret_authorization_server_client_tests = { path = "../margaret_authorization_server_client_tests" }
margaret_http = { workspace = true }
margaret_http_tests = { path = "../margaret_http_tests" }
margaret_issuer_key_set = { workspace = true }
margaret_jwks_keygen = { workspace = true }
