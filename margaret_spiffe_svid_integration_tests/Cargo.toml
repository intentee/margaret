[package]
name = "margaret_spiffe_svid_integration_tests"
version = "0.1.0"
edition = "2024"
autotests = false

[features]
default = ["tests_that_use_spire"]
tests_that_use_spire = []

[dev-dependencies]
margaret_spiffe_svid = { path = "../margaret_spiffe_svid" }
margaret_spiffe_svid_client = { path = "../margaret_spiffe_svid_client" }
margaret_spiffe_svid_server = { path = "../margaret_spiffe_svid_server" }
margaret_spiffe_svid_tests = { path = "../margaret_spiffe_svid_tests", default-features = false }
rustls = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { workspace = true }
trzcina = { workspace = true }

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"
