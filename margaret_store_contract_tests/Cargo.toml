[package]
name = "margaret_store_contract_tests"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[dependencies]
chrono = { workspace = true, features = ["clock"] }
futures-util = { workspace = true }
margaret_accepted_clients = { workspace = true }
margaret_authorization_grants = { workspace = true }
margaret_jwks_keygen = { workspace = true }
margaret_jwks_keygen_tests = { path = "../margaret_jwks_keygen_tests" }
margaret_jwks_roller = { workspace = true }
margaret_oauth_vocabulary = { workspace = true }
margaret_registered_claims = { workspace = true }
margaret_token_digest = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
anyhow = { workspace = true }
margaret_accepted_clients_tests = { path = "../margaret_accepted_clients_tests" }
margaret_authorization_grants_database = { workspace = true }
margaret_client_assertions_database = { workspace = true }
margaret_cluster_fixture = { path = "../margaret_cluster_tests/fixture" }
margaret_database_tests = { path = "../margaret_database_tests" }
margaret_jwks_roller_tests = { path = "../margaret_jwks_roller_tests" }
margaret_model = { workspace = true }
margaret_oidc_provider_tests = { path = "../margaret_oidc_provider_tests" }
margaret_signing_keys_database = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[features]
tests_that_use_postgres = []

[[test]]
name = "database"
path = "tests/database/main.rs"

[[test]]
name = "main"
path = "tests/main.rs"

[lints]
workspace = true
