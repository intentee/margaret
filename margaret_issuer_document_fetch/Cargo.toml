[package]
name = "margaret_issuer_document_fetch"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Fetches documents published by a token issuer for the Margaret application framework."
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true
autotests = false

[dependencies]
bytes = { workspace = true }
reqwest = { workspace = true, features = ["native-tls"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros"] }
tokio-util = { workspace = true }
url = { workspace = true }

[dev-dependencies]
margaret_http = { workspace = true }
margaret_http_tests = { path = "../margaret_http_tests" }
rustls = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }

[[test]]
name = "main"
path = "tests/main.rs"

[lints]
workspace = true
