[package]
name = "margaret"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
description = "An opinionated Rust application framework with compile-time verified architecture and dependency injection."
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true
keywords = ["framework", "dependency-injection", "code-generation", "compile-time"]
categories = ["web-programming"]

[dependencies]
anyhow = { workspace = true, optional = true }
margaret_access_token_minter = { workspace = true, optional = true }
margaret_asset_bag = { workspace = true, optional = true }
margaret_codegen = { workspace = true, optional = true }
margaret_console = { workspace = true, optional = true }
margaret_construction = { workspace = true, optional = true }
margaret_environment_variable = { workspace = true, optional = true }
margaret_http = { workspace = true, optional = true }
margaret_http_uploaded_file = { workspace = true, optional = true }
margaret_http_validation = { workspace = true, optional = true }
margaret_identity = { workspace = true, optional = true }
margaret_identity_session = { workspace = true, optional = true }
margaret_jwks_client = { workspace = true, optional = true }
margaret_jwks_endpoint = { workspace = true, optional = true }
margaret_jwks_file_secret_storage = { workspace = true, optional = true }
margaret_jwks_keygen = { workspace = true, optional = true }
margaret_jwks_roller = { workspace = true, optional = true }
margaret_jwks_roller_server = { workspace = true, optional = true }
margaret_jwks_secret_storage_selection = { workspace = true, optional = true }
margaret_jwks_secret_store = { workspace = true, optional = true }
margaret_macros = { workspace = true, optional = true }
margaret_model = { workspace = true, optional = true }
margaret_peer_identity = { workspace = true, optional = true }
margaret_route_parameter_binding = { workspace = true, optional = true }
margaret_service = { workspace = true, optional = true }
margaret_spiffe_svid = { workspace = true, optional = true }
margaret_spiffe_svid_bundle = { workspace = true, optional = true }
margaret_spiffe_svid_client = { workspace = true, optional = true }
margaret_spiffe_svid_server = { workspace = true, optional = true }
margaret_sync_holder = { workspace = true, optional = true }
margaret_token_signer = { workspace = true, optional = true }
margaret_validation = { workspace = true, optional = true }
margaret_views = { workspace = true, optional = true }
margaret_websocket = { workspace = true, optional = true }
margaret_websocket_client = { workspace = true, optional = true }
margaret_websocket_envelope = { workspace = true, optional = true }
margaret_websocket_session = { workspace = true, optional = true }

[features]
default = ["runtime"]
codegen = ["dep:margaret_codegen"]
runtime = [
    "dep:anyhow",
    "dep:margaret_access_token_minter",
    "dep:margaret_asset_bag",
    "dep:margaret_console",
    "dep:margaret_construction",
    "dep:margaret_environment_variable",
    "dep:margaret_http",
    "dep:margaret_http_uploaded_file",
    "dep:margaret_http_validation",
    "dep:margaret_identity",
    "dep:margaret_identity_session",
    "dep:margaret_jwks_client",
    "dep:margaret_jwks_endpoint",
    "dep:margaret_jwks_file_secret_storage",
    "dep:margaret_jwks_keygen",
    "dep:margaret_jwks_roller",
    "dep:margaret_jwks_roller_server",
    "dep:margaret_jwks_secret_storage_selection",
    "dep:margaret_jwks_secret_store",
    "dep:margaret_macros",
    "dep:margaret_model",
    "dep:margaret_peer_identity",
    "dep:margaret_route_parameter_binding",
    "dep:margaret_service",
    "dep:margaret_spiffe_svid",
    "dep:margaret_spiffe_svid_bundle",
    "dep:margaret_spiffe_svid_client",
    "dep:margaret_spiffe_svid_server",
    "dep:margaret_sync_holder",
    "dep:margaret_token_signer",
    "dep:margaret_validation",
    "dep:margaret_views",
    "dep:margaret_websocket",
    "dep:margaret_websocket_client",
    "dep:margaret_websocket_envelope",
    "dep:margaret_websocket_session",
]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
