[package]
name = "margaret"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
description = "An opinionated Rust application framework with compile-time verified architecture and dependency injection."
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true
keywords = ["framework", "dependency-injection", "code-generation", "compile-time"]
categories = ["web-programming"]

[dependencies]
anyhow = { workspace = true, optional = true }
margaret_accepted_clients = { workspace = true, optional = true }
margaret_access_token_minter = { workspace = true, optional = true }
margaret_active_record = { workspace = true, optional = true }
margaret_asset_bag = { workspace = true, optional = true }
margaret_authorization_grants = { workspace = true, optional = true }
margaret_authorization_server_client = { workspace = true, optional = true }
margaret_bearer_token_verification = { workspace = true, optional = true }
margaret_client_assertions = { workspace = true, optional = true }
margaret_client_credentials = { workspace = true, optional = true }
margaret_codegen = { workspace = true, optional = true }
margaret_console = { workspace = true, optional = true }
margaret_construction = { workspace = true, optional = true }
margaret_database = { workspace = true, optional = true }
margaret_environment_variable = { workspace = true, optional = true }
margaret_http = { workspace = true, optional = true }
margaret_http_uploaded_file = { workspace = true, optional = true }
margaret_http_validation = { workspace = true, optional = true }
margaret_identity = { workspace = true, optional = true }
margaret_identity_session = { workspace = true, optional = true }
margaret_issuer_directory = { workspace = true, optional = true }
margaret_issuer_key_set = { workspace = true, optional = true }
margaret_issuer_metadata = { workspace = true, optional = true }
margaret_issuer_request = { workspace = true, optional = true }
margaret_jose_parameters = { workspace = true, optional = true }
margaret_jwks_keygen = { workspace = true, optional = true }
