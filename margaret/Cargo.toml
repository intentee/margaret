    "dep:margaret_oidc_sign_in",
    "dep:margaret_peer_identity",
    "dep:margaret_registered_claims",
    "dep:margaret_route_method",
    "dep:margaret_route_parameter_binding",
    "dep:margaret_service",
    "dep:margaret_signing_keys",
    "dep:margaret_spiffe_svid",
    "dep:margaret_spiffe_svid_bundle",
    "dep:margaret_spiffe_svid_client",
    "dep:margaret_spiffe_svid_server",
    "dep:margaret_sql_identifier",
    "dep:margaret_subject_token_exchange",
    "dep:margaret_sync_holder",
    "dep:margaret_token_digest",
    "dep:margaret_token_exchange_client",
    "dep:margaret_token_introspection",
    "dep:margaret_token_issuance",
    "dep:margaret_token_signer",
    "dep:margaret_token_trust",
    "dep:margaret_trusted_issuer",
    "dep:margaret_validation",
    "dep:margaret_views",
    "dep:margaret_websocket",
    "dep:margaret_websocket_session",
    "dep:oauth2",
]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
