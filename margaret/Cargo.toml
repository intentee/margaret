margaret_jwks_roller_server = { workspace = true, optional = true }
margaret_jwks_secret_store = { workspace = true, optional = true }
margaret_jws_verification = { workspace = true, optional = true }
margaret_jwt_verification = { workspace = true, optional = true }
margaret_macros = { workspace = true, optional = true }
margaret_model = { workspace = true, optional = true }
margaret_oauth_client = { workspace = true, optional = true }
margaret_oauth_vocabulary = { workspace = true, optional = true }
margaret_oidc_discovery = { workspace = true, optional = true }
margaret_oidc_provider = { workspace = true, optional = true }
margaret_oidc_sign_in = { workspace = true, optional = true }
margaret_peer_identity = { workspace = true, optional = true }
margaret_registered_claims = { workspace = true, optional = true }
margaret_route_method = { workspace = true, optional = true }
margaret_route_parameter_binding = { workspace = true, optional = true }
margaret_service = { workspace = true, optional = true }
margaret_signing_keys = { workspace = true, optional = true }
margaret_spiffe_svid = { workspace = true, optional = true }
margaret_spiffe_svid_bundle = { workspace = true, optional = true }
margaret_spiffe_svid_client = { workspace = true, optional = true }
margaret_spiffe_svid_server = { workspace = true, optional = true }
margaret_sql_identifier = { workspace = true, optional = true }
margaret_subject_token_exchange = { workspace = true, optional = true }
margaret_sync_holder = { workspace = true, optional = true }
margaret_token_digest = { workspace = true, optional = true }
margaret_token_exchange_client = { workspace = true, optional = true }
margaret_token_introspection = { workspace = true, optional = true }
