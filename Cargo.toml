[workspace]
resolver = "3"
members = [
    "margaret_attributes",
    "margaret_codegen",
    "margaret_console",
    "margaret_console_codegen",
    "margaret_container",
    "margaret_example",
    "margaret_example_macros",
    "margaret_example_plugin",
    "margaret_http",
    "margaret_http_codegen",
    "margaret_macros",
    "margaret_security",
    "margaret_security_codegen",
    "margaret_security_tests",
    "margaret_service",
    "margaret_service_codegen",
    "margaret_service_tests",
]

[workspace.dependencies]
anyhow = "=1.0.102"
argon2 = "=0.5.3"
async-trait = "=0.1.89"
bytes = "=1.12.0"
clap = { version = "=4.5.47", default-features = false, features = ["std", "help", "usage", "error-context"] }
cookie = "=0.18.1"
dashmap = "=6.1.0"
form_urlencoded = "=1.2.1"
heck = "=0.5.0"
http = "=1.4.2"
http-body-util = "=0.1.3"
hyper = "=1.10.1"
hyper-util = "=0.1.20"
jsonwebtoken = "=9.3.1"
matchit = "=0.8.6"
prettyplease = "=0.2.37"
proc-macro2 = "=1.0.106"
quote = "=1.0.46"
serde = { version = "=1.0.228", features = ["derive"] }
syn = { version = "=2.0.118", features = ["full", "extra-traits"] }
tempfile = "=3.20.0"
thiserror = "=2.0.18"
tokio = "=1.52.3"
tokio-util = "=0.7.18"
toml = "=1.1.2"
tower = "=0.5.3"
trzcina = "=0.3.0"
uuid = { version = "=1.18.1", features = ["v4"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
