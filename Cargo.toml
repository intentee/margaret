[workspace]
resolver = "3"
members = [
    "margaret_attributes",
    "margaret_codegen",
    "margaret_codegen_tokens",
    "margaret_console",
    "margaret_console_argument_codegen",
    "margaret_console_codegen",
    "margaret_container",
    "margaret_container_tests",
    "margaret_esbuild_metafile_codegen",
    "margaret_example",
    "margaret_generated_module",
    "margaret_http",
    "margaret_http_codegen",
    "margaret_http_tests",
    "margaret_http_validation",
    "margaret_identity_session",
    "margaret_injection_codegen",
    "margaret_jwks_client",
    "margaret_jwks_client_tests",
    "margaret_jwks_key_gen",
    "margaret_jwks_key_gen_tests",
    "margaret_jwks_roller",
    "margaret_jwks_roller_server",
    "margaret_jwks_roller_tests",
    "margaret_macros",
    "margaret_peer_identity",
    "margaret_peer_identity_tests",
    "margaret_service",
    "margaret_service_codegen",
    "margaret_service_tests",
    "margaret_spiffe_svid",
    "margaret_spiffe_svid_client",
    "margaret_spiffe_svid_client_tests",
    "margaret_spiffe_svid_integration_tests",
    "margaret_spiffe_svid_server",
    "margaret_spiffe_svid_server_tests",
    "margaret_spiffe_svid_tests",
    "margaret_sync_holder",
    "margaret_token_signer",
    "margaret_token_signer_tests",
    "margaret_validation",
    "margaret_views",
    "margaret_views_codegen",
]

[workspace.dependencies]
anyhow = "=1.0.102"
async-trait = "=0.1.89"
base64ct = "=1.8.3"
bytes = "=1.12.0"
chrono = { version = "=0.4.42", default-features = false, features = ["std"] }
clap = { version = "=4.5.47", default-features = false, features = ["std", "help", "usage", "error-context"] }
cookie = "=0.18.1"
dashmap = "=6.1.0"
esbuild-metafile = "=0.10.0"
form_urlencoded = "=1.2.2"
futures-util = "=0.3.31"
heck = "=0.5.0"
http = "=1.4.2"
http-body = "=1.0.1"
http-body-util = "=0.1.3"
hyper = "=1.10.1"
hyper-util = "=0.1.20"
libc = "=0.2.186"
log = "=0.4.28"
matchit = "=0.8.4"
maud = "=0.27.0"
mime = "=0.3.17"
multer = "=3.1.0"
p256 = "=0.13.2"
p384 = "=0.13.1"
prettyplease = "=0.2.37"
proc-macro2 = "=1.0.106"
quote = "=1.0.46"
rcgen = "=0.14.8"
reqwest = { version = "=0.12.26", features = ["json", "rustls-tls"] }
rustls = "=0.23.35"
rustls-webpki = "=0.103.13"
serde = "=1.0.228"
serde_json = "=1.0.150"
spiffe = { version = "=0.6.7", default-features = false }
syn = { version = "=2.0.118", features = ["full", "extra-traits"] }
tempfile = "=3.20.0"
thiserror = "=2.0.18"
tokio = "=1.52.3"
tokio-rustls = "=0.26.4"
tokio-util = "=0.7.18"
tower = "=0.5.3"
trzcina = "=0.4.0"
url = "=2.5.7"
uuid = "=1.18.1"
validator = "=0.20.0"
x509-parser = "=0.17.0"
zeroize = "=1.9.0"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
ignored_unit_patterns = "warn"
must_use_candidate = "warn"

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.margaret_jwks_key_gen]
opt-level = 3
