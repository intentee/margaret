[workspace]
resolver = "3"
members = [
    "margaret_attributes",
    "margaret_codegen",
    "margaret_container",
    "margaret_container_example",
    "margaret_http",
    "margaret_http_codegen",
    "margaret_http_example",
    "margaret_http_example_macros",
    "margaret_macros",
]

[workspace.dependencies]
async-trait = "=0.1.89"
bytes = "=1.12.0"
heck = "=0.5.0"
http = "=1.4.2"
http-body-util = "=0.1.3"
hyper = "=1.10.1"
hyper-util = "=0.1.20"
matchit = "=0.8.6"
prettyplease = "=0.2.37"
proc-macro2 = "=1.0.106"
quote = "=1.0.46"
syn = { version = "=2.0.118", features = ["full", "extra-traits"] }
tempfile = "=3.20.0"
thiserror = "=2.0.18"
tokio = "=1.52.3"
tower = "=0.5.3"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
