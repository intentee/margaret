[workspace]
resolver = "3"
members = [
    "margaret_attributes",
    "margaret_container",
    "margaret_container_example",
    "margaret_macros",
]

[workspace.dependencies]
heck = "=0.5.0"
prettyplease = "=0.2.37"
proc-macro2 = "=1.0.106"
quote = "=1.0.46"
syn = { version = "=2.0.118", features = ["full", "extra-traits"] }
tempfile = "=3.20.0"
thiserror = "=2.0.18"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
