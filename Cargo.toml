[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
license = "Apache-2.0"
repository = "https://github.com/intentee/margaret"
readme = "README.md"
publish = ["crates-io"]

[workspace.dependencies]
