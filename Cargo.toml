[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
license = "Apache-2.0"
repository = "https://github.com/intentee/margaret"
readme = "README.md"
publish = ["crates-io"]

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
aws-lc-rs = { version = "1.17", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }
base64ct = "1.8"
bytes = "1.12"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage", "error-context"] }
cookie = "0.18"
dashmap = "6.1"
ephemeral-postgres = "0.3"
esbuild-metafile = "0.10"
form_urlencoded = "1.2"
futures-util = "0.3"
heck = "0.5"
http = "1.4"
http-body = "1.0"
http-body-util = "0.1"
hyper = "1.10"
hyper-util = "0.1"
jsonwebtoken = "9.3"
libc = "0.2"
log = "0.4"
matchit = "0.8"
maud = "0.27"
mime = "0.3"
multer = "3.1"
p256 = { version = "0.13", features = ["jwk"] }
p384 = { version = "0.13", features = ["jwk"] }
percent-encoding = "2.3"
prettyplease = "0.2"
proc-macro2 = "1.0"
quote = "1.0"
rcgen = "0.14"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
rust_decimal = { version = "1.42", default-features = false, features = ["std"] }
rustls = "0.23"
rustls-webpki = "0.103"
serde = "1.0"
serde_json = "1.0"
spiffe = { version = "0.6", default-features = false }
sqlx = { version = "0.9", features = ["chrono", "postgres", "runtime-tokio", "rust_decimal", "uuid"] }
syn = { version = "2.0", features = ["full", "extra-traits"] }
tempfile = "3.20"
thiserror = "2.0"
tokio = "1.52"
tokio-rustls = "0.26"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tokio-util = "0.7"
toml = "0.8"
tower = "0.5"
trzcina = "0.4"
url = "2.5"
uuid = "1.18"
validator = "0.20"
x509-parser = "0.17"
zeroize = "1.9"

