[workspace]
resolver = "3"
members = [
    "margaret_access_token_minter",
    "margaret_asset_bag",
    "margaret_asset_bag_codegen",
    "margaret_attributes",
    "margaret_codegen",
    "margaret_codegen_tests",
    "margaret_codegen_tests/tests/fixtures/clippy_clean_console_arguments",
    "margaret_codegen_tests/tests/fixtures/self_referential_model",
    "margaret_codegen_tests/tests/fixtures/websocket_console_argument_provider",
    "margaret_codegen_tokens",
    "margaret_console",
    "margaret_console_argument_codegen",
    "margaret_console_codegen",
    "margaret_container",
    "margaret_container_tests",
    "margaret_jwks_endpoint",
    "margaret_example",
    "margaret_generated_module",
    "margaret_http",
    "margaret_http_codegen",
    "margaret_http_tests",
    "margaret_http_validation",
    "margaret_identity",
    "margaret_identity_session",
    "margaret_injection_codegen",
    "margaret_jwks_client",
    "margaret_jwks_client_tests",
    "margaret_jwks_codegen",
    "margaret_jwks_file_secret_storage",
    "margaret_jwks_file_secret_storage_tests",
    "margaret_jwks_keygen",
    "margaret_jwks_keygen_tests",
    "margaret_jwks_roller",
    "margaret_jwks_roller_server",
    "margaret_jwks_roller_tests",
    "margaret_jwks_secret_storage_selection",
    "margaret_jwks_secret_storage_selection_tests",
    "margaret_jwks_secret_store",
    "margaret",
    "margaret_macros",
    "margaret_middleware_codegen",
    "margaret_model",
    "margaret_model_codegen",
    "margaret_peer_identity",
    "margaret_peer_identity_tests",
    "margaret_request_binding_codegen",
    "margaret_route_parameter_codegen",
    "margaret_schema_codegen",
    "margaret_schema_identifier_naming",
    "margaret_schema_postgres_tests",
    "margaret_service",
    "margaret_service_codegen",
    "margaret_service_tests",
    "margaret_spiffe_svid",
    "margaret_spiffe_svid_client",
    "margaret_spiffe_svid_client_tests",
    "margaret_spiffe_svid_integration_tests",
    "margaret_spiffe_svid_server",
    "margaret_spiffe_svid_server_tests",
    "margaret_spiffe_svid_tests",
    "margaret_sync_holder",
    "margaret_tag_codegen",
    "margaret_token_signer",
    "margaret_token_signer_tests",
    "margaret_toposort",
    "margaret_validation",
    "margaret_views",
    "margaret_views_codegen",
    "margaret_websocket",
    "margaret_websocket_codegen",
    "margaret_websocket_tests",
]

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64ct = "1.8"
bytes = "1.12"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage", "error-context"] }
cookie = "0.18"
dashmap = "6.1"
ephemeral-postgres = "0.3"
esbuild-metafile = "0.10"
form_urlencoded = "1.2"
futures-util = "0.3"
heck = "0.5"
http = "1.4"
http-body = "1.0"
http-body-util = "0.1"
hyper = "1.10"
hyper-util = "0.1"
libc = "0.2"
log = "0.4"
matchit = "0.8"
maud = "0.27"
mime = "0.3"
multer = "3.1"
p256 = "0.13"
p384 = "0.13"
prettyplease = "0.2"
proc-macro2 = "1.0"
quote = "1.0"
rcgen = "0.14"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
rustls = "0.23"
rustls-webpki = "0.103"
serde = "1.0"
serde_json = "1.0"
spiffe = { version = "0.6", default-features = false }
sqlx = { version = "0.9", features = ["chrono", "postgres", "runtime-tokio", "uuid"] }
syn = { version = "2.0", features = ["full", "extra-traits"] }
tempfile = "3.20"
thiserror = "2.0"
tokio = "1.52"
tokio-rustls = "0.26"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tokio-util = "0.7"
toml = "0.8"
tower = "0.5"
trzcina = "0.4"
url = "2.5"
uuid = "1.18"
validator = "0.20"
x509-parser = "0.17"
zeroize = "1.9"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
ignored_unit_patterns = "warn"
must_use_candidate = "warn"

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.margaret_jwks_keygen]
opt-level = 3
