[package]
name = "margaret_provider_state_storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Stores the single-use authorization codes, rotating refresh token families and pending consents of the Margaret OpenID Connect provider."
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
margaret_oauth_vocabulary = { workspace = true }
margaret_token_digest = { workspace = true }
moka = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
url = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["serde", "v4"] }

[lints]
workspace = true
