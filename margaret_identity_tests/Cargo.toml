[package]
name = "margaret_identity_tests"
version = "0.1.0"
edition = "2024"
autotests = false

[dependencies]
chrono = { workspace = true }
clap = { workspace = true }
margaret_cookie_jar = { path = "../margaret_cookie_jar" }
margaret_http = { path = "../margaret_http" }
margaret_identity = { path = "../margaret_identity" }
rustls = { workspace = true }
spiffe = { workspace = true, features = ["spiffe-types"] }
