[package]
name = "margaret_jwks_roller_server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "JWKS rotation server support for the Margaret application framework."
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true
autotests = false

[dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
margaret_database = { workspace = true }
margaret_deadline = { workspace = true }
margaret_handler_error = { workspace = true }
margaret_http = { workspace = true }
margaret_jwks_keygen = { workspace = true }
margaret_jwks_roller = { workspace = true }
margaret_registered_claims = { workspace = true }
margaret_sync_holder = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tokio-util = { workspace = true }

[dev-dependencies]
http = { workspace = true }
margaret_database_tests = { path = "../margaret_database_tests" }
margaret_http_tests = { path = "../margaret_http_tests" }
margaret_jwks_keygen_tests = { path = "../margaret_jwks_keygen_tests" }
margaret_jwks_roller_tests = { path = "../margaret_jwks_roller_tests" }
margaret_signing_keys = { workspace = true }
margaret_signing_keys_tests = { path = "../margaret_signing_keys_tests" }
margaret_sql_identifier = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "test-util", "time"] }

[features]
tests_that_use_postgres = []

[[test]]
name = "main"
path = "tests/main.rs"

[lints]
workspace = true
