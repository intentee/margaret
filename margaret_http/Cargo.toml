[package]
name = "margaret_http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "HTTP server runtime support for the Margaret application framework."
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
cookie = { workspace = true }
form_urlencoded = { workspace = true }
futures-util = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["http1", "server", "server-auto", "server-graceful", "service", "tokio"] }
margaret_http_uploaded_file = { workspace = true }
margaret_peer_identity = { workspace = true }
margaret_route_method = { workspace = true }
margaret_route_parameter_binding = { workspace = true }
matchit = { workspace = true }
maud = { workspace = true }
mime = { workspace = true }
multer = { workspace = true }
percent-encoding = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
spiffe = { workspace = true, features = ["spiffe-types"] }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt"] }
tokio-rustls = { workspace = true }
tokio-util = { workspace = true }
tower = { workspace = true, features = ["util"] }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread"] }

[lints]
workspace = true
