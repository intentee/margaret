[package]
name = "margaret_jwks_keygen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "JWKS key generation for the Margaret application framework."
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true

[dependencies]
aws-lc-rs = { workspace = true, features = ["ring-io"] }
base64ct = { workspace = true }
margaret_jose_parameters = { workspace = true }
margaret_jws_verification = { workspace = true }
margaret_registered_claims = { workspace = true }
margaret_sync_holder = { workspace = true }
p256 = { workspace = true }
p384 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
zeroize = { workspace = true, features = ["serde"] }

[lints]
workspace = true
