[package]
name = "margaret_oauth_client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Declares how an application authenticates as a client of an OAuth authorization server, for the Margaret application framework."
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true
autotests = false

[dependencies]
headers = { workspace = true }
margaret_identity_session = { workspace = true }
margaret_jose_parameters = { workspace = true }
margaret_jwks_roller_server = { workspace = true }
margaret_oauth_vocabulary = { workspace = true }
margaret_registered_claims = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
margaret_jwks_secret_store_tests = { path = "../margaret_jwks_secret_store_tests" }
margaret_jws_verification = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[[test]]
name = "main"
path = "tests/main.rs"

[lints]
workspace = true
