[package]
name = "margaret_websocket_tests"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
margaret_http = { workspace = true }
margaret_http_tests = { path = "../margaret_http_tests" }
margaret_http_uploaded_file = { workspace = true }
margaret_http_validation = { workspace = true }
margaret_websocket = { workspace = true }
margaret_websocket_client = { workspace = true }
margaret_websocket_envelope = { workspace = true }
margaret_websocket_session = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync"] }
tokio-rustls = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
url = { workspace = true }
validator = { workspace = true, features = ["derive"] }

[[test]]
name = "main"
path = "tests/main.rs"

[lints]
workspace = true
