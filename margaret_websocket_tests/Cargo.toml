[package]
name = "margaret_websocket_tests"
version = "0.1.0"
edition = "2024"
autotests = false

[dependencies]
async-trait = { workspace = true }
futures-util = { workspace = true }
margaret_http = { path = "../margaret_http" }
margaret_websocket = { path = "../margaret_websocket" }
serde = { workspace = true, features = ["derive"] }
