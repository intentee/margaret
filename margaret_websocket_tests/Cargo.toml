tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread", "sync"] }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
validator = { workspace = true, features = ["derive"] }

[[test]]
name = "main"
path = "tests/main.rs"

[lints]
workspace = true
