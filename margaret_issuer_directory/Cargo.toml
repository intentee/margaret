[package]
name = "margaret_issuer_directory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Polls the key sets of every distinct issuer an application trusts, once per issuer, for the Margaret application framework."
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true

[dependencies]
futures-util = { workspace = true }
log = { workspace = true }
margaret_issuer_key_set = { workspace = true }
margaret_issuer_metadata = { workspace = true }
margaret_issuer_request = { workspace = true }
margaret_jws_verification = { workspace = true }
margaret_oidc_discovery = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true, features = ["macros", "time"] }
tokio-util = { workspace = true }
url = { workspace = true }

[dev-dependencies]
margaret_https_url = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "test-util", "time"] }

[lints]
workspace = true
