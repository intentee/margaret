[package]
name = "margaret_oidc_provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Serves discovery, authorization, token, revocation, introspection and userinfo endpoints of an OpenID Connect provider for the Margaret application framework."
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true

[dependencies]
