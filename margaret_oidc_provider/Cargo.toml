margaret_accepted_clients = { workspace = true }
margaret_authorization_grants = { workspace = true }
margaret_database = { workspace = true }
margaret_http = { workspace = true }
margaret_identity_session = { workspace = true }
margaret_jose_parameters = { workspace = true }
margaret_jwks_roller_server = { workspace = true }
margaret_jwks_secret_store = { workspace = true }
margaret_jwt_verification = { workspace = true }
margaret_oauth_vocabulary = { workspace = true }
margaret_oidc_discovery = { workspace = true }
margaret_registered_claims = { workspace = true }
margaret_subject_token_exchange = { workspace = true }
margaret_token_digest = { workspace = true }
margaret_token_exchange_client = { workspace = true }
margaret_token_issuance = { workspace = true }
margaret_validation = { workspace = true }
oauth2 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
