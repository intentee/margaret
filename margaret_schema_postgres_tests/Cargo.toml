[package]
name = "margaret_schema_postgres_tests"
version = "0.1.0"
edition = "2024"
autotests = false

[dependencies]
chrono = { workspace = true, features = ["clock"] }
ephemeral-postgres = { workspace = true }
margaret = { path = "../margaret" }
margaret_example = { path = "../margaret_example" }
margaret_model = { path = "../margaret_model" }
sqlx = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[features]
tests_that_use_postgres = []

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"
