[package]
name = "margaret_schema_postgres_tests"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[dev-dependencies]
chrono = { workspace = true }
margaret = { workspace = true }
margaret_authorization_grants = { workspace = true }
margaret_client_assertions = { workspace = true }
margaret_database_tests = { path = "../margaret_database_tests" }
margaret_model = { workspace = true }
margaret_schema_postgres_fixture = { path = "fixture" }
margaret_signing_keys = { workspace = true }
margaret_sql_identifier = { workspace = true }
rust_decimal = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-postgres = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[features]
tests_that_use_postgres = []

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"
