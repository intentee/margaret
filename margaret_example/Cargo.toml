[package]
name = "margaret_example"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
dashmap = { workspace = true }
margaret_console = { path = "../margaret_console" }
margaret_http = { path = "../margaret_http" }
margaret_http_validation = { path = "../margaret_http_validation" }
margaret_jwks_roller = { path = "../margaret_jwks_roller" }
margaret_jwks_roller_server = { path = "../margaret_jwks_roller_server" }
margaret_macros = { path = "../margaret_macros" }
margaret_service = { path = "../margaret_service" }
margaret_spiffe_svid = { path = "../margaret_spiffe_svid" }
margaret_spiffe_svid_server = { path = "../margaret_spiffe_svid_server" }
margaret_validation = { path = "../margaret_validation" }
serde = { workspace = true, features = ["derive"] }
spiffe = { workspace = true, features = ["spiffe-types"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { workspace = true }
trzcina = { workspace = true }
validator = { workspace = true, features = ["derive"] }

[build-dependencies]
margaret_codegen = { path = "../margaret_codegen" }

[lints]
workspace = true
