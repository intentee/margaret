[package]
name = "margaret_example"
version = "0.1.0"
edition = "2024"
autotests = false

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
margaret_console = { path = "../margaret_console" }
margaret_example_macros = { path = "../margaret_example_macros" }
margaret_example_plugin = { path = "../margaret_example_plugin" }
margaret_http = { path = "../margaret_http" }
margaret_macros = { path = "../margaret_macros" }
margaret_service = { path = "../margaret_service" }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { workspace = true }

[build-dependencies]
margaret_codegen = { path = "../margaret_codegen" }

[dev-dependencies]
bytes = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }

[[test]]
name = "main"
path = "tests/main.rs"

[lints]
workspace = true
