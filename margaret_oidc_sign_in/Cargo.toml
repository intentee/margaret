[package]
name = "margaret_oidc_sign_in"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Signs users in through an OpenID Connect provider with the authorization code flow, PKCE and a nonce, for the Margaret application framework."
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true

[dependencies]
aws-lc-rs = { workspace = true }
base64ct = { workspace = true, features = ["alloc"] }
chrono = { workspace = true, features = ["clock"] }
cookie = { workspace = true }
http = { workspace = true }
margaret_authorization_server_client = { workspace = true }
margaret_http = { workspace = true }
margaret_identity_session = { workspace = true }
margaret_issuer_metadata = { workspace = true }
margaret_jwks_secret_store = { workspace = true }
margaret_jwt_verification = { workspace = true }
margaret_oauth_vocabulary = { workspace = true }
margaret_oidc_discovery = { workspace = true }
margaret_registered_claims = { workspace = true }
margaret_token_digest = { workspace = true }
margaret_trusted_issuer = { workspace = true }
oauth2 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
url = { workspace = true }

[lints]
workspace = true
