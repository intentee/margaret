[profile.default]
slow-timeout = { period = "100ms", terminate-after = 2 }

[test-groups]
postgres = { max-threads = 4 }

[[profile.default.overrides]]
filter = 'package(~_spiffe_svid)'
slow-timeout = { period = "1s", terminate-after = 2 }

[[profile.default.overrides]]
filter = 'package(margaret_postgres_pool_tests)'
test-group = 'postgres'
slow-timeout = { period = "2s", terminate-after = 2 }

[[profile.default.overrides]]
filter = 'package(margaret_schema_postgres_tests)'
test-group = 'postgres'
slow-timeout = { period = "2s", terminate-after = 2 }
