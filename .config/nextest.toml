[profile.default]
slow-timeout = { period = "100ms", terminate-after = 2 }

[[profile.default.overrides]]
filter = 'package(~_spiffe_svid)'
slow-timeout = { period = "1s", terminate-after = 2 }

[[profile.default.overrides]]
filter = 'binary_id(margaret_active_record_tests::compile_fail)'
slow-timeout = { period = "30s", terminate-after = 2 }
threads-required = 'num-test-threads'

[[profile.default.overrides]]
filter = 'package(margaret_accepted_clients_tests) | package(margaret_active_record_tests) | package(margaret_authorization_grants_tests) | package(margaret_client_assertions_tests) | package(margaret_database_tests) | binary_id(margaret_jwks_roller_server::main) | package(margaret_jwks_roller_tests) | package(margaret_oidc_provider_tests) | package(margaret_signing_keys_tests) | package(margaret_schema_postgres_tests) | package(margaret_example_tests)'
slow-timeout = { period = "3s", terminate-after = 2 }
threads-required = 'num-test-threads'

[[profile.default.overrides]]
filter = 'test(~spire)'
threads-required = 'num-test-threads'

[[profile.default.overrides]]
filter = 'test(generates_an_rsa_signing_key_that_signs_verifiable_tokens)'
threads-required = 'num-test-threads'

[[profile.default.overrides]]
filter = 'package(margaret_openid_conformance_tests)'
slow-timeout = { period = "60s", terminate-after = 2 }
threads-required = 'num-test-threads'

[[profile.default.overrides]]
filter = 'package(margaret_cluster_tests)'
slow-timeout = { period = "15s", terminate-after = 2 }
threads-required = 'num-test-threads'
