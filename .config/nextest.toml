[profile.default]
slow-timeout = { period = "100ms", terminate-after = 2 }

[[profile.default.overrides]]
filter = 'package(~_spiffe_svid)'
slow-timeout = { period = "1s", terminate-after = 2 }

[[profile.default.overrides]]
filter = 'package(margaret_schema_postgres_tests) | package(margaret_example_tests) | binary_id(margaret_store_contract_tests::database)'
slow-timeout = { period = "3s", terminate-after = 2 }
threads-required = 'num-test-threads'

[[profile.default.overrides]]
filter = 'test(~spire)'
threads-required = 'num-test-threads'

[[profile.default.overrides]]
filter = 'test(generates_an_rsa_signing_key_that_signs_verifiable_tokens)'
threads-required = 'num-test-threads'

[[profile.default.overrides]]
filter = 'package(margaret_openid_conformance_tests)'
slow-timeout = { period = "60s", terminate-after = 2 }
threads-required = 'num-test-threads'

[[profile.default.overrides]]
filter = 'binary_id(margaret_cluster_tests::integration)'
slow-timeout = { period = "10s", terminate-after = 2 }
threads-required = 'num-test-threads'
