[profile.default]
slow-timeout = { period = "10ms", terminate-after = 2 }

# The SPIFFE/SPIRE integration tests bring up a real spire-server + spire-agent
# cluster and wait on socket/workload-API readiness (30s internal timeouts in
# SpireTestClusterParams). They are legitimately slow, so they get a longer
# backstop than the framework's fast unit tests. The 60s period (120s hard
# terminate) comfortably exceeds the 30s readiness timeouts with margin.
[[profile.default.overrides]]
filter = 'package(margaret_spiffe_svid_manager)'
slow-timeout = { period = "60s", terminate-after = 2 }

[[profile.default.overrides]]
filter = 'package(margaret_spiffe_svid_manager_tests)'
slow-timeout = { period = "60s", terminate-after = 2 }
