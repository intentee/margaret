[package]
name = "margaret_issuer_request"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Requests the documents a token issuer publishes, under one transport policy, for the Margaret application framework."
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true
autotests = false

[dependencies]
bytes = { workspace = true }
http = { workspace = true }
reqwest = { workspace = true, features = ["native-tls"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros"] }
tokio-util = { workspace = true }
url = { workspace = true }

[dev-dependencies]
margaret_http = { workspace = true }
margaret_http_tests = { path = "../margaret_http_tests" }
margaret_route_method = { workspace = true }
rustls = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "test-util"] }

[[test]]
name = "main"
path = "tests/main.rs"

[lints]
workspace = true
