name: postgres tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  postgres:
    name: postgres
    runs-on: ovh-linux-x64-b3-16
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.137

      - name: run the postgres tests
        run: make test.postgres
