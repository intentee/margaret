name: unit tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: test
    runs-on: ovh-linux-x64-b3-16
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.137

      - name: run tests
        run: make test.unit

  clippy:
    name: clippy
    runs-on: ovh-linux-x64-b3-16
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: run clippy
        run: make clippy
